name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked

      - name: Run formatting, linting, typing, tests, and secret scan
        run: uv run python scripts/quality.py

      - name: Build wheel
        run: uv build --wheel
