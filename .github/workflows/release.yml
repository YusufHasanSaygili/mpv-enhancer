name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to publish with repaired release tooling
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and audit release
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out protected tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Require an annotated version-matched tag
        shell: pwsh
        run: |
          $tagType = git cat-file -t $env:RELEASE_TAG
          if ($tagType -ne "tag") {
            throw "Release tags must be annotated; found $tagType."
          }
          uv run --locked python scripts/release_version.py $env:RELEASE_TAG

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked

      - name: Download pinned official mpv playback test binary
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpv-playback-test.zip"
          $destination = Join-Path $env:RUNNER_TEMP "mpv-playback-test"
          $url = "https://github.com/mpv-player/mpv/releases/download/git-release/mpv-v0.41.0-dev-gf4d13e1c2-31356187173-x86_64-pc-windows-msvc.zip"
          $expected = "ecbac93878aaba79cab62105e5186f93701deeacb14b95a3afa70d0369cb1ba9"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Pinned mpv playback-test archive checksum mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem $destination -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $executable) {
            throw "Pinned mpv playback-test executable was not found."
          }
          "MPV_TEST_EXE=$($executable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete quality gate
        run: uv run python scripts/quality.py

      - name: Audit locked runtime dependencies
        shell: pwsh
        run: |
          $requirements = "dist/runtime-requirements-$env:RELEASE_TAG.txt"
          uv export --format requirements.txt --no-dev --no-emit-project --locked --output-file $requirements
          uv run pip-audit --requirement $requirements --strict

      - name: Build wheel and CycloneDX SBOM
        shell: pwsh
        run: |
          uv build --wheel
          uv export --format cyclonedx1.5 --preview-features sbom-export --no-dev --locked --output-file "dist/mpv-enhancer-$env:RELEASE_TAG.cdx.json"
          Copy-Item THIRD_PARTY_NOTICES.md "dist/THIRD_PARTY_NOTICES-$env:RELEASE_TAG.md"

      - name: Check out repaired verification tooling
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: verification-tooling

      - name: Install and launch wheel in a fresh environment
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          $requirements = Get-ChildItem dist/runtime-requirements-*.txt | Select-Object -First 1
          uv venv build/release-smoke --python 3.12
          uv pip install --python build/release-smoke/Scripts/python.exe --require-hashes --requirement $requirements.FullName
          uv pip install --python build/release-smoke/Scripts/python.exe --no-deps $wheel.FullName
          $smokeScript = "scripts/release_smoke.py"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $smokeScript = "verification-tooling/scripts/release_smoke.py"
          }
          & build/release-smoke/Scripts/python.exe -I $smokeScript --mpv $env:MPV_TEST_EXE

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { -not $_.Name.StartsWith('.') } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines("dist/SHA256SUMS.txt", $lines)

      - name: Create immutable release evidence
        shell: pwsh
        run: |
          $sourceCommit = git rev-list -n 1 $env:RELEASE_TAG
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $assets = Get-ChildItem dist -File |
            Where-Object { -not $_.Name.StartsWith('.') } |
            Sort-Object Name |
            ForEach-Object { "- $($_.Name)" }
          $checksums = Get-Content dist/SHA256SUMS.txt | ForEach-Object { "- ``$($_)``" }
          $evidence = @(
            "# MPV Enhancer $env:RELEASE_TAG release evidence",
            "",
            "- Release URL: $releaseUrl",
            "- Workflow run and public verification: $runUrl",
            "- Release source tag commit: $sourceCommit",
            "- Verification tooling commit: $env:GITHUB_SHA",
            "- Build runner: clean GitHub-hosted Windows environment",
            "- Complete quality gate: PASS",
            "- Locked runtime dependency audit: PASS",
            "- Fresh virtual environment install: PASS",
            "- Offscreen 20-file queue, episodes 2/4/6 multi-edit, mixed-state, and no-leak settings workflows: PASS",
            "- Episode 6 Turkish and Episode 7 Spanish subtitle selection workflows: PASS",
            "- Embedded local playback with Unicode and leading-hyphen filename: PASS",
            "- Public download and checksum verification: see the successful Verify public Windows asset job in the workflow run",
            "",
            "## Reviewed assets",
            ""
          ) + $assets + @("", "## SHA-256 checksums", "") + $checksums
          $evidencePath = "dist/release-evidence-$env:RELEASE_TAG.md"
          [System.IO.File]::WriteAllLines($evidencePath, $evidence)

      - name: Upload reviewed release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish public pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download reviewed assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Create immutable GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "MPV Enhancer $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease

  verify-public:
    name: Verify public Windows asset
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out smoke test from tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check out repaired verification tooling
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: verification-tooling

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Download pinned official mpv playback test binary
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpv-playback-test.zip"
          $destination = Join-Path $env:RUNNER_TEMP "mpv-playback-test"
          $url = "https://github.com/mpv-player/mpv/releases/download/git-release/mpv-v0.41.0-dev-gf4d13e1c2-31356187173-x86_64-pc-windows-msvc.zip"
          $expected = "ecbac93878aaba79cab62105e5186f93701deeacb14b95a3afa70d0369cb1ba9"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Pinned mpv playback-test archive checksum mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem $destination -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $executable) {
            throw "Pinned mpv playback-test executable was not found."
          }
          "MPV_TEST_EXE=$($executable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download assets from the public release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path public-assets | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir public-assets

      - name: Verify published SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = "public-assets/SHA256SUMS.txt"
          foreach ($line in Get-Content $checksumFile) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum line: $line"
            }
            $expectedHash = $Matches[1]
            $assetName = $Matches[2]
            $assetPath = Join-Path public-assets $assetName
            $actualHash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Checksum mismatch for $assetName."
            }
          }

      - name: Install and launch the published wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem public-assets/*.whl | Select-Object -First 1
          $requirements = Get-ChildItem public-assets/runtime-requirements-*.txt | Select-Object -First 1
          python -m venv build/public-release-smoke
          & build/public-release-smoke/Scripts/python.exe -m pip install --require-hashes --requirement $requirements.FullName
          & build/public-release-smoke/Scripts/python.exe -m pip install --no-deps $wheel.FullName
          $smokeScript = "scripts/release_smoke.py"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $smokeScript = "verification-tooling/scripts/release_smoke.py"
          }
          & build/public-release-smoke/Scripts/python.exe -I $smokeScript --mpv $env:MPV_TEST_EXE

      - name: Record public verification summary
        shell: pwsh
        run: |
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $assets = Get-ChildItem public-assets -File | Sort-Object Name | ForEach-Object { "- $($_.Name)" }
          $checksums = Get-Content public-assets/SHA256SUMS.txt | ForEach-Object { "- ``$($_)``" }
          $summary = @(
            "# MPV Enhancer $env:RELEASE_TAG public verification",
            "",
            "- Release URL: $releaseUrl",
            "- Workflow run: $runUrl",
            "- Runner: clean GitHub-hosted Windows environment",
            "- Public download: PASS",
            "- SHA-256 verification: PASS",
            "- Fresh virtual environment install: PASS",
            "- Offscreen 20-file queue, episodes 2/4/6 multi-edit, mixed-state, and no-leak settings workflows: PASS",
            "- Episode 6 Turkish and Episode 7 Spanish subtitle selection workflows: PASS",
            "- Published wheel embedded local playback with Unicode and leading-hyphen filename: PASS",
            "",
            "## Downloaded assets",
            ""
          ) + $assets + @("", "## Verified checksums", "") + $checksums
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
