name: Verify Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable public release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-public:
    name: Verify immutable public Windows release
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out smoke test from release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Validate public immutable release
        shell: pwsh
        run: |
          python scripts/release_version.py $env:RELEASE_TAG
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.draft -or -not $release.immutable) {
            throw "Release $env:RELEASE_TAG must be public and immutable."
          }

      - name: Download assets from the public release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path public-assets | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir public-assets

      - name: Verify published SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = "public-assets/SHA256SUMS.txt"
          foreach ($line in Get-Content $checksumFile) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum line: $line"
            }
            $expectedHash = $Matches[1]
            $assetName = $Matches[2]
            $assetPath = Join-Path public-assets $assetName
            $actualHash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Checksum mismatch for $assetName."
            }
          }

      - name: Install and launch the published wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem public-assets/*.whl | Select-Object -First 1
          $requirements = Get-ChildItem public-assets/runtime-requirements-*.txt | Select-Object -First 1
          python -m venv build/public-release-smoke
          & build/public-release-smoke/Scripts/python.exe -m pip install --require-hashes --requirement $requirements.FullName
          & build/public-release-smoke/Scripts/python.exe -m pip install --no-deps $wheel.FullName
          & build/public-release-smoke/Scripts/python.exe -I scripts/release_smoke.py

      - name: Record verification summary
        shell: pwsh
        run: |
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $assets = Get-ChildItem public-assets -File | Sort-Object Name | ForEach-Object { "- $($_.Name)" }
          $checksums = Get-Content public-assets/SHA256SUMS.txt | ForEach-Object { "- ``$($_)``" }
          $summary = @(
            "# MPV Enhancer $env:RELEASE_TAG immutable public verification",
            "",
            "- Release URL: $releaseUrl",
            "- Workflow run: $runUrl",
            "- Runner: clean GitHub-hosted Windows environment",
            "- Public immutable release check: PASS",
            "- Public download: PASS",
            "- SHA-256 verification: PASS",
            "- Fresh Python 3.12 environment install: PASS",
            "- Offscreen application shell launch and close: PASS",
            "",
            "## Downloaded assets",
            ""
          ) + $assets + @("", "## Verified checksums", "") + $checksums
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
