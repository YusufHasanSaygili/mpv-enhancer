[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mpv-enhancer"
version = "0.1.1"
description = "Windows-first desktop playlist controller and playback shell for mpv"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mpv", "playlist", "pyside6", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
mpv-enhancer = "mpv_enhancer.app:main"

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5,<2",
    "mypy>=1.15,<2",
    "pip-audit>=2.10.1,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-qt>=4.4,<5",
    "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/YusufHasanSaygili/mpv-enhancer"
Issues = "https://github.com/YusufHasanSaygili/mpv-enhancer/issues"
Repository = "https://github.com/YusufHasanSaygili/mpv-enhancer.git"

[tool.hatch.build.targets.wheel]
packages = ["src/mpv_enhancer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mpv_enhancer"]
pretty = true

[tool.coverage.run]
branch = true
source = ["mpv_enhancer"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
